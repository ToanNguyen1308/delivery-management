server:
  port: 8080
  servlet:
    context-path: ${APP_CONTEXT_PATH:/api/v1}
  error:
    include-message: always

spring:
  application:
    name: delivery-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:delivery_user}
    password: ${DB_PASSWORD:delivery_pass_2026}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Khong khai bao dialect: Hibernate 6 tu nhan dien tu ket noi JDBC.
        # Nho vay doi sang MariaDB chi can doi DB_URL va DB_DRIVER.
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 50
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      # Redis chi dung lam cache va thu hoi token, khong co repository nao.
      # Tat viec quet de Spring khong doi chieu 20 repository JPA voi Redis luc khoi dong.
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 30MB

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Cho phep nhom health tham chieu toi thanh phan co the bi tat o mot so moi truong.
      # Vi du khi chay local khong co Redis va dat MANAGEMENT_HEALTH_REDIS_ENABLED=false,
      # ung dung van khoi dong thay vi bao 'redis does not exist'.
      validate-group-membership: false
      # Nhom liveness chi kiem tra ung dung va database. Docker healthcheck dung nhom nay
      # de Redis hoac MinIO tam thoi gian doan khong lam container bi restart oan.
      group:
        liveness:
          include: ping, db
        readiness:
          include: ping, db, redis

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:viettel-delivery-super-secret-key-change-me-in-production-2026}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:delivery-files}
  vnpay:
    enabled: ${VNPAY_ENABLED:true}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/result}
    version: 2.1.0
    command: pay
    currency-code: VND
    locale: vn
  dispatch:
    strategy: ${DISPATCH_STRATEGY:NEAREST}
    max-radius-km: ${DISPATCH_MAX_RADIUS_KM:15}

logging:
  level:
    root: INFO
    com.viettel.delivery: DEBUG
    org.hibernate.SQL: INFO
